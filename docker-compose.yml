services:
  pixel-agents:
    image: pixel-agents:latest
    container_name: pixel-agents
    ports:
      # 호스트의 loopback에만 공개한다. 앞의 "127.0.0.1:"이 없으면 도커는
      # 포트를 호스트의 모든 인터페이스에 여는데, standalone /ws는 Bearer 토큰을
      # 요구하지 않으므로(embedded 모드 전용 검사) 같은 네트워크의 누구나
      # 인증 없이 붙을 수 있게 된다. 원격 접속은 SSH 터널로 한다:
      #   ssh -L 3100:localhost:3100 user@server
      - "127.0.0.1:3100:3100"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3100
    volumes:
      # M2 (수정): 네임드 볼륨으로 컨테이너 상태 격리
      # 호스트의 ~/.pixel-agents와 분리 — 컨테이너는 자기 상태를 자체 볼륨에 저장
      # (Windows 절대경로가 리눅스 컨테이너에서 무효화되는 문제 해결)
      - pixel-agents-state:/home/app/.pixel-agents
      # M2 (추가): 에이전트 작업 대상 폴더 — 컨테이너 안에서 고용한 직원은 /workspace 경로로 작업
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3100/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: no

volumes:
  pixel-agents-state:
    driver: local
