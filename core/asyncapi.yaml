# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        - $ref: '#/components/schemas/AgentTokenUsage'
        - $ref: '#/components/schemas/PlanUsage'
        # Shell bridge
        - $ref: '#/components/schemas/ShellOutput'
        - $ref: '#/components/schemas/ShellExit'
        # Employees (each one a session + an office character)
        - $ref: '#/components/schemas/EmployeeState'
        - $ref: '#/components/schemas/AgentSessionEvent'
        - $ref: '#/components/schemas/AgentPermissionRequest'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/OfficeProvider'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/WorkspaceFolders'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/SetClaudeModel'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/RequestDiagnostics'
        - $ref: '#/components/schemas/RunShellCommand'
        - $ref: '#/components/schemas/KillShellCommand'
        - $ref: '#/components/schemas/HireEmployee'
        - $ref: '#/components/schemas/FireEmployee'
        - $ref: '#/components/schemas/SendAgentMessage'
        - $ref: '#/components/schemas/AgentPermissionDecision'
        - $ref: '#/components/schemas/RefreshPlanUsage'
        - $ref: '#/components/schemas/SetOfficeProvider'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        folderName:
          type: string
        isExternal:
          type: boolean

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentTokenUsage:
      description: Cumulative token usage for the agent's session.
      type: object
      additionalProperties: false
      required: [type, id, inputTokens, outputTokens]
      properties:
        type:
          const: agentTokenUsage
        id:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        model:
          type: string
          description: Model id from the latest assistant record (e.g. claude-fable-5).
        contextTokens:
          type: integer
          description: Latest request context size (input + cache read/creation + output).
        contextLimit:
          type: integer
          description: Context window for the configured model (1M for "[1m]" variants, else 200k).

    PlanUsage:
      description: |
        Estimated Claude plan usage gauges. Percentages are estimated from
        weighted aggregation of local transcript JSONL usage records
        (input x1, cache creation x1.25, cache read x0.1, output x5),
        calibrated against the user snapshot in ~/.pixel-agents/plan-usage.json.
        Only tokens recorded after each gauge's last reset are counted.
        Broadcast periodically by the server.
      type: object
      additionalProperties: false
      required: [type, sessionPercent, weeklyAllPercent, weeklyModelPercent, calibrated]
      properties:
        type:
          const: planUsage
        sessionPercent:
          type: number
          description: Estimated 0-100 percent of the 5-hour session limit.
        sessionResetsAt:
          type: string
          description: ISO timestamp when the session gauge resets.
        weeklyAllPercent:
          type: number
          description: Estimated 0-100 percent of the weekly all-model limit.
        weeklyModelPercent:
          type: number
          description: Estimated 0-100 percent of the weekly per-model (Fable) limit.
        weeklyResetsAt:
          type: string
          description: ISO timestamp when both weekly gauges reset.
        calibrated:
          type: boolean
          description: False when no snapshot file exists (percentages are uncalibrated raw estimates).

    ShellStreamName:
      type: string
      enum: [stdout, stderr, system]

    ShellOutput:
      description: |
        One chunk of output from a shell command started via RunShellCommand.
        `system` stream carries bridge-level notices (timeout, kill, spawn errors).
      type: object
      additionalProperties: false
      required: [type, execId, stream, data]
      properties:
        type:
          const: shellOutput
        execId:
          type: string
        stream:
          $ref: '#/components/schemas/ShellStreamName'
        data:
          type: string

    ShellExit:
      description: Command finished (or failed to spawn). Terminal message for an execId.
      type: object
      additionalProperties: false
      required: [type, execId]
      properties:
        type:
          const: shellExit
        execId:
          type: string
        exitCode:
          type: integer
        error:
          type: string
          description: Present when the process could not be spawned or was killed.

    EmployeeState:
      description: |
        The whole staff. Broadcast whenever someone is hired, fired, or reports
        a new model / context fill. Each employee owns one session and one
        office character, keyed by the same agentId.
      type: object
      additionalProperties: false
      required: [type, employees]
      properties:
        type:
          const: employeeState
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeInfo'

    EmployeeRole:
      type: string
      description: |
        vp = the user's own assistant, owns the top folder and is the only one
        who may delegate. staff = owns one folder and does the work.
      enum: [vp, staff]

    AuthMode:
      type: string
      description: |
        How an employee's session authenticates to Claude. The mode is decided by
        which credential is injected into the session's environment, following the
        SDK's own precedence (ANTHROPIC_API_KEY > CLAUDE_CODE_OAUTH_TOKEN > login):

        - subscription: no credential injected (both env vars removed), so the SDK
          falls back to the local Claude Code login of whoever runs the server.
        - oauthToken: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`.
        - apiKey: ANTHROPIC_API_KEY — pay-per-use, the only mode fit for someone
          other than the server's owner.

        Plan gauges only mean something for subscription/oauthToken; an apiKey
        employee reports accumulated cost in dollars instead.
      enum: [subscription, oauthToken, apiKey]

    EmployeeProvider:
      description: |
        The AI an employee is plugged into. Omitted at hire time = follow the
        office default. Secrets travel client -> server only; they are stored in the
        home directory and never sent back to a client (see OfficeProvider).
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/AuthMode'
        apiKey:
          type: string
          description: Required when mode is apiKey.
        oauthToken:
          type: string
          description: Required when mode is oauthToken.

    EmployeeInfo:
      type: object
      additionalProperties: false
      required: [agentId, name, cwd, role]
      properties:
        agentId:
          type: integer
          description: Also the id of this employee's office character.
        name:
          type: string
        cwd:
          type: string
          description: The folder this employee is responsible for.
        role:
          $ref: '#/components/schemas/EmployeeRole'
        model:
          type: string
          description: Model of the employee's latest reply; empty until it answers.
        contextTokens:
          type: integer
          description: |
            How full the employee's context window is, taken from the reply's own
            usage (uncached + cached + output). 0 until it answers.
        contextLimit:
          type: integer
        authMode:
          $ref: '#/components/schemas/AuthMode'
        ownProvider:
          type: boolean
          description: True when this employee overrides the office default.
        costUsd:
          type: number
          description: |
            What this employee's session has cost in total, taken from the running
            total the SDK reports on every result (measured: it reports the session
            total, not the turn's own cost). The SDK prices subscription work too,
            so this is only shown in apiKey mode — there it is an actual bill; on a
            subscription it would be a number nobody is charged.

    AgentEventKind:
      type: string
      enum: [user, text, tool, result]

    AgentSessionEvent:
      description: |
        One piece of an employee's transcript: the user's own message echoed
        back, assistant text, a tool name, or a turn result.
      type: object
      additionalProperties: false
      required: [type, agentId, kind, text]
      properties:
        type:
          const: agentEvent
        agentId:
          type: integer
        kind:
          $ref: '#/components/schemas/AgentEventKind'
        text:
          type: string

    AgentPermissionRequest:
      description: |
        An employee's tool call needs approval. That employee's session blocks
        until the client answers with AgentPermissionDecision (or it times out).
      type: object
      additionalProperties: false
      required: [type, agentId, requestId, toolName, title, input]
      properties:
        type:
          const: agentPermissionRequest
        agentId:
          type: integer
        requestId:
          type: string
        toolName:
          type: string
        title:
          type: string
          description: Prompt sentence rendered by the SDK, when available.
        input:
          type: string
          description: Truncated JSON of the tool input, for display.

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - hooksEnabled
        - hooksInfoShown
        - externalAssetDirectories
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    WorkspaceFolders:
      description: Multi-root workspace folders (VS Code only).
      type: object
      additionalProperties: false
      required: [type, folders]
      properties:
        type:
          const: workspaceFolders
        folders:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFolder'

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    LaunchAgent:
      description: Launch a new Claude agent in a new terminal.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        folderPath:
          type: string
          description: Workspace folder path (for multi-root workspaces).
        bypassPermissions:
          type: boolean

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: Save the office layout to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetClaudeModel:
      description: |
        Write the given model id into ~/.claude/settings.json ("model" key).
        Applies to NEW Claude Code sessions only — a running session cannot be
        switched from outside.
      type: object
      additionalProperties: false
      required: [type, model]
      properties:
        type:
          const: setClaudeModel
        model:
          type: string

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setHooksEnabled
        enabled:
          type: boolean

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    RunShellCommand:
      description: |
        Execute a PowerShell command on the server host (standalone mode only).
        The server streams ShellOutput chunks and always finishes with ShellExit.
        The server binds to 127.0.0.1, so only local clients can reach this.
      type: object
      additionalProperties: false
      required: [type, execId, command]
      properties:
        type:
          const: runShellCommand
        execId:
          type: string
          description: Client-generated id correlating ShellOutput/ShellExit messages.
        command:
          type: string
        cwd:
          type: string
          description: Working directory. Defaults to the server process cwd.

    KillShellCommand:
      description: Terminate a running shell command by execId.
      type: object
      additionalProperties: false
      required: [type, execId]
      properties:
        type:
          const: killShellCommand
        execId:
          type: string

    HireEmployee:
      description: |
        Hire an employee: start a session in the given folder and put a matching
        character in the office. Standalone mode only; the session runs on the
        server host, authenticated by the provider given here (or the office
        default when `provider` is omitted). Tool calls needing approval go through
        AgentPermissionRequest.
      type: object
      additionalProperties: false
      required: [type, name, cwd, role]
      properties:
        type:
          const: hireEmployee
        name:
          type: string
        cwd:
          type: string
          description: The folder this employee is responsible for.
        role:
          $ref: '#/components/schemas/EmployeeRole'
        provider:
          $ref: '#/components/schemas/EmployeeProvider'

    FireEmployee:
      description: End an employee's session and remove their character.
      type: object
      additionalProperties: false
      required: [type, agentId]
      properties:
        type:
          const: fireEmployee
        agentId:
          type: integer

    SendAgentMessage:
      description: Send one user message to a specific employee.
      type: object
      additionalProperties: false
      required: [type, agentId, text]
      properties:
        type:
          const: sendAgentMessage
        agentId:
          type: integer
        text:
          type: string

    AgentPermissionDecision:
      description: Allow or deny a pending tool call, answering AgentPermissionRequest.
      type: object
      additionalProperties: false
      required: [type, requestId, allow]
      properties:
        type:
          const: agentPermissionDecision
        requestId:
          type: string
        allow:
          type: boolean


    RefreshPlanUsage:
      description: |
        Re-calibrate the plan gauges by running `claude -p /usage` (a local
        slash command: no model call, zero tokens) and rewriting the snapshot.
        The server answers with a fresh PlanUsage broadcast.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: refreshPlanUsage

    SetOfficeProvider:
      description: |
        Set the office-wide default AI: which credential every employee gets
        unless they carry their own. Saved to the home directory, applied to
        employees hired from now on (running sessions keep the credential they
        started with). The server answers with an OfficeProvider broadcast.
      type: object
      additionalProperties: false
      required: [type, mode]
      properties:
        type:
          const: setOfficeProvider
        mode:
          $ref: '#/components/schemas/AuthMode'
        apiKey:
          type: string
          description: Required when mode is apiKey. Stored in the home directory only.
        oauthToken:
          type: string
          description: Required when mode is oauthToken. Stored in the home directory only.
        model:
          type: string
          description: |
            Default model for employees. Empty falls back to ~/.claude/settings.json
            in subscription mode, and to the SDK default otherwise.

    OfficeProvider:
      description: |
        The office default AI, as the client is allowed to see it: the mode and
        whether a secret is on file, never the secret itself. Sent on webviewReady
        and after every SetOfficeProvider.
      type: object
      additionalProperties: false
      required: [type, mode, hasSecret]
      properties:
        type:
          const: officeProvider
        mode:
          $ref: '#/components/schemas/AuthMode'
        hasSecret:
          type: boolean
          description: A key/token is stored for this mode (its value is never sent).
        model:
          type: string

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: Add an external asset directory (host shows a directory picker).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    # ── Supporting schemas ─────────────────────────────────────────

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    WorkspaceFolder:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer
