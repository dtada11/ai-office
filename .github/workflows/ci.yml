# CI — 타입·lint·포맷·단위 테스트·빌드.
#
# e2e는 없다. 상류에서 물려받은 Playwright 스위트(51개)를 2026-07-20에 지웠다.
# 49개가 VS Code를 띄우는 테스트였는데 그 경로는 접기로 한 방향이고, 검사 대상도
# 상류가 만든 기능이었으며, 한글화 이후로는 영어 UI 문자열을 찾다가 전부 실패하는
# 상태였다. 이쪽 기능(직원·팀·회의보드·권한)은 server/__tests__ 와 webview-ui/test
# 의 단위 테스트가 덮는다.
#
# 각 검사에 `if: always()`가 붙어 있는 이유: 앞 단계가 실패해도 나머지를 계속
# 돌린다. 하나 고치고 올렸더니 그 다음 게 터지는 걸 반복하지 않으려는 것.
# 실패한 단계가 하나라도 있으면 잡 전체는 실패로 끝난다.

name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci는 package-lock.json 그대로 설치한다(npm install과 달리 lock을
      # 고쳐 쓰지 않음). 로컬과 같은 버전으로 검사한다는 뜻.
      - name: Install
        id: install
        run: npm ci

      - name: Type Check
        if: always() && steps.install.outcome == 'success'
        run: npm run check-types

      - name: Lint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint

      - name: Format Check
        if: always() && steps.install.outcome == 'success'
        run: npm run format:check

      - name: Server Tests
        if: always() && steps.install.outcome == 'success'
        run: npm run test:server

      - name: Webview Tests
        if: always() && steps.install.outcome == 'success'
        run: npm run test:webview

      # check-types와 lint는 위에서 이미 돌았으므로 `npm run package`(둘을 다시
      # 실행함) 대신 빌드 단계만 직접 부른다. 여기서 깨지면 원인이 빌드라는 게
      # 바로 드러난다.
      - name: Build Extension + CLI
        if: always() && steps.install.outcome == 'success'
        run: node esbuild.js --production

      - name: Build Webview
        if: always() && steps.install.outcome == 'success'
        run: npm run build:webview
